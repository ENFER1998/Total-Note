<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App Repartidor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-5">
    <h2 class="text-xl font-bold text-center text-gray-800 mb-6">Entrega de Encomiendas</h2>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700">ID del Envío (Ej: ENV-1234)</label>
      <input type="text" id="idEnvio" class="mt-1 w-full border rounded-lg p-3 text-lg">
    </div>

    <!-- Integración de Cámara -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Foto del Paquete (Evidencia)</label>
      <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center cursor-pointer hover:bg-gray-50 transition" onclick="document.getElementById('camera').click()">
        <span class="text-blue-500 font-bold">📸 Abrir Cámara</span>
        <input type="file" id="camera" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
      </div>
      <img id="preview" class="mt-3 rounded-lg hidden w-full h-48 object-cover">
    </div>

    <button onclick="confirmarEntrega()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg mb-4 shadow-lg active:bg-green-600">
      ✅ Confirmar Entrega
    </button>

    <hr class="my-6">

    <!-- Impresión Térmica Bluetooth -->
    <h3 class="text-md font-bold text-gray-700 mb-2">Impresión de Tickets (TSI)</h3>
    <button onclick="conectarEImprimir(false)" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg mb-2 shadow-lg">
      🖨️ Imprimir Ticket (Cliente)
    </button>
    <button onclick="conectarEImprimir(true)" class="w-full bg-indigo-800 text-white font-bold py-3 rounded-lg shadow-lg">
      🖨️ Imprimir Ticket (Empresa con Firma)
    </button>
  </div>

  <script>
    let base64Photo = "";

    // Convertir foto a Base64 para enviarla al backend
    function previewImage(event) {
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview').classList.remove('hidden');
        base64Photo = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function confirmarEntrega() {
      const id = document.getElementById('idEnvio').value;
      if(!id || !base64Photo) return alert("Falta el ID o la foto.");
      
      document.body.style.opacity = '0.5'; // Loading state
      google.script.run.withSuccessHandler(res => {
        document.body.style.opacity = '1';
        if(res.success) {
          alert("Entrega confirmada y foto guardada.");
          document.getElementById('preview').classList.add('hidden');
          base64Photo = "";
        } else {
          alert("Error: " + res.error);
        }
      }).confirmarEntrega(id, base64Photo);
    }

    // LÓGICA BLUETOOTH IMPRESORA TÉRMICA (Comandos ESC/POS)
    async function conectarEImprimir(esCopiaEmpresa) {
      try {
        // Solicita conectar al dispositivo (requiere Chrome en Android)
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb'] // UUID genérico de impresoras
        });
        
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
        const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');

        // Formato exacto del ticket TSI en texto plano
        let ticketTexto = 
          "--------------------------------\n" +
          "   TRANSPORTADORA SAN IGNACIO   \n" +
          "      ENCOMIENDAS Y CARGAS      \n" +
          " RUC: 80051359-2                \n" +
          "--------------------------------\n" +
          "      COMPROBANTE DE ENVIO      \n" +
          "--------------------------------\n" +
          "ORIGEN: CDE\n" +
          "FECHA: " + new Date().toLocaleDateString() + "\n" +
          "AGENTE: FERNANDO RODRIGUEZ\n" +
          "--------------------------------\n" +
          "DESTINO: ASUNCION\n" +
          "--------------------------------\n" +
          "REMITENTE: \n" +
          "DESTINATARIO: \n" +
          "--------------------------------\n" +
          "DETALLE:\n" +
          "1 (UNO) PAQUETE\n" +
          "--------------------------------\n" +
          "COSTO Gs: 25.000\n" +
          "PAGO: COBRO EN DESTINO\n";

        if (esCopiaEmpresa) {
          ticketTexto += "\n\nFIRMA: _______________________\nACLARACION:\n";
        }
        
        ticketTexto += "\n\n\n"; // Avance de papel

        // Convertir texto a bytes para enviar a la impresora
        let encoder = new TextEncoder("utf-8");
        let data = encoder.encode(ticketTexto);
        
        // Enviar en chunks si es muy grande (Bluetooth BLE limita a 512 bytes usualmente)
        await characteristic.writeValue(data);
        alert("Ticket impreso correctamente.");

      } catch (error) {
        console.error("Error Bluetooth:", error);
        alert("Fallo la conexión Bluetooth. Asegúrate de tener el GPS y Bluetooth activados, y usar Chrome en Android.");
      }
    }
  </script>
</body>
</html>
